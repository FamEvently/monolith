spring:
  application:
    name: monolith
    namespace: live
  datasource:
    url: jdbc:mariadb://${DB_HOST_FAMEVENTLY}/famevently?autoReconnect=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-test-query: "SELECT NOW()"
      maximum-pool-size: 20
      minimum-idle: 8
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 5s
server:
  tomcat:
    mbeanregistry:
      enabled: true
  shutdown: graceful

